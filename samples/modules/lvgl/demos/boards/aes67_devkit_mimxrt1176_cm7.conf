CONFIG_LV_Z_VDB_ALIGN=8
CONFIG_LV_DRAW_BUF_ALIGN=8
CONFIG_LV_Z_ATTRIBUTE_MEM_ALIGN_SIZE=8
CONFIG_LV_DEF_REFR_PERIOD=33
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
CONFIG_LV_Z_LVGL_WORKQUEUE_STACK_SIZE=8192

# Hot code to the ITCM, frame buffers to the SDRAM, see aes67_devkit_mimxrt1176_cm7.cmake
CONFIG_CODE_DATA_RELOCATION=y
# The 256 KB DTCM as zephyr,sram defaults to small heaps only, the display heap is bigger
CONFIG_SYS_HEAP_AUTO=y
